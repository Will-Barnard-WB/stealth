version: 2
updates:
  # Only the root reactor. fixtures/ isn't part of it, so its deliberately outdated
  # and vulnerable dependencies are never updated (see fixtures/README.md).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
