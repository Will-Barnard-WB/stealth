name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mvnw: ./mvnw
          - os: windows-latest
            mvnw: .\mvnw.cmd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Tests (Surefire *Test, Failsafe *IT) and spotless:check
      - run: ${{ matrix.mvnw }} -B -ntp verify

      # Packages the CLI zip the same way a release does (what brew and scoop install), then runs its launcher
      - name: Assemble release zip
        run: ${{ matrix.mvnw }} -B -ntp -N jreleaser:assemble

      - name: Run packaged CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          unzip -q target/jreleaser/assemble/stealth/java-archive/stealth-*.zip -d target/smoke
          stealth=$(echo target/smoke/stealth-*/bin/stealth)
          "$stealth" --version
          "$stealth" doctor fixtures/boot4-clean

      - name: Run packaged CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = Get-ChildItem target/jreleaser/assemble/stealth/java-archive/stealth-*.zip
          Expand-Archive -Path $zip.FullName -DestinationPath target/smoke
          $stealth = (Get-ChildItem target/smoke/stealth-*/bin/stealth.bat).FullName
          & $stealth --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $stealth doctor fixtures/boot4-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  # Single, stable check name for branch protection, whatever the matrix looks like
  ci:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - if: needs.build.result != 'success'
        run: |
          echo "build result: ${{ needs.build.result }}"
          exit 1
      - run: echo "All builds passed"
