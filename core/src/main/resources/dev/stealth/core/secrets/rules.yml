# The secrets analyzer's ruleset. Written for stealth from the providers' published token formats;
# not copied from gitleaks or any other scanner.
#
# Each rule:
#   id, name, description, severity   the Rule, see docs/rules/secrets.md. Ids never change once released.
#   keywords        a file is only searched if it contains one of these (case-insensitive). Keeps scanning fast.
#   min-entropy     optional. Only report values with at least this Shannon entropy (bits per character), and
#                   skip values that look like names rather than secrets: URLs, paths, identifiers, UUIDs.
#   patterns        Java regexes. The named group `secret` is the secret value (the whole match without one);
#                   an optional `key` group is the name it's assigned to. `files` limits a pattern to file
#                   extensions; without it the pattern applies to every file.
#
# Every rule skips obvious placeholders (EXAMPLE, changeme, ${ENV_VAR}, <your-key>, xxxx...).

rules:
  - id: secrets/aws-access-key-id
    name: AWS access key id
    description: An AWS access key id, which with its secret key gives access to an AWS account.
    severity: critical
    keywords: [AKIA, ASIA, ABIA, ACCA]
    patterns:
      - regex: '(?<![A-Za-z0-9])(?<secret>(?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})(?![A-Za-z0-9])'

  - id: secrets/aws-secret-access-key
    name: AWS secret access key
    description: An AWS secret access key assigned to an aws_secret_access_key setting.
    severity: critical
    keywords: [aws_secret, aws-secret, aws.secret, awssecret]
    min-entropy: 4.0
    patterns:
      - regex: '(?i)(?<key>aws[_.-]?secret[_.-]?(?:access[_.-]?)?key)["'']?\s*[:=]\s*["'']?(?<secret>[A-Za-z0-9/+]{40})(?![A-Za-z0-9/+])'

  - id: secrets/github-token
    name: GitHub token
    description: A GitHub personal access, OAuth, app or refresh token (ghp_, gho_, ghu_, ghs_, ghr_).
    severity: critical
    keywords: [ghp_, gho_, ghu_, ghs_, ghr_]
    patterns:
      - regex: '(?<![A-Za-z0-9_])(?<secret>gh[pousr]_[A-Za-z0-9]{36,251})(?![A-Za-z0-9_])'

  - id: secrets/github-fine-grained-token
    name: GitHub fine-grained token
    description: A GitHub fine-grained personal access token (github_pat_).
    severity: critical
    keywords: [github_pat_]
    patterns:
      - regex: '(?<![A-Za-z0-9_])(?<secret>github_pat_[A-Za-z0-9_]{82})(?![A-Za-z0-9_])'

  - id: secrets/slack-token
    name: Slack token
    description: A Slack bot, user, app or configuration token (xoxb-, xoxp-, xoxa-, ...).
    severity: high
    keywords: [xox]
    patterns:
      - regex: '(?<![A-Za-z0-9-])(?<secret>xox[abeoprs]-[A-Za-z0-9-]{10,250})(?![A-Za-z0-9-])'

  - id: secrets/slack-webhook-url
    name: Slack webhook URL
    description: A Slack incoming webhook URL, which lets anyone post to the channel.
    severity: high
    keywords: [hooks.slack.com]
    patterns:
      - regex: 'https://hooks\.slack\.com/services/(?<secret>T[A-Z0-9]{8,12}/B[A-Z0-9]{8,12}/[A-Za-z0-9]{24})(?![A-Za-z0-9])'

  - id: secrets/stripe-secret-key
    name: Stripe live secret key
    description: A Stripe live-mode secret or restricted key (sk_live_, rk_live_).
    severity: critical
    keywords: [_live_]
    patterns:
      - regex: '(?<![A-Za-z0-9_])(?<secret>(?:sk|rk)_live_[A-Za-z0-9]{24,247})(?![A-Za-z0-9_])'

  - id: secrets/google-api-key
    name: Google API key
    description: A Google Cloud or Firebase API key (AIza...).
    severity: high
    keywords: [AIza]
    patterns:
      - regex: '(?<![A-Za-z0-9_-])(?<secret>AIza[0-9A-Za-z_-]{35})(?![A-Za-z0-9_-])'

  - id: secrets/gcp-service-account-key
    name: Google Cloud service account key
    description: A Google Cloud service account key file (JSON with a private_key_id).
    severity: critical
    keywords: [private_key_id]
    patterns:
      - regex: '"private_key_id"\s*:\s*"(?<secret>[0-9a-f]{40})"'

  - id: secrets/private-key
    name: Private key
    description: A PEM or OpenSSH private key block (RSA, EC, DSA, OpenSSH, PGP, PKCS#8).
    severity: critical
    keywords: [PRIVATE KEY]
    patterns:
      # The body can't contain quotes or `;`: code that builds a PEM from string pieces isn't a key
      - regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----(?:\s|\\n)*(?<secret>(?:(?!-----END)[^"''`;]){64,65536})-----END (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----'

  - id: secrets/jwt
    name: JSON Web Token
    description: A signed JSON Web Token, which may still be valid for the service that issued it.
    severity: medium
    keywords: [eyJ]
    patterns:
      - regex: '(?<![A-Za-z0-9_-])(?<secret>eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})(?![A-Za-z0-9_-])'

  - id: secrets/generic-secret
    name: High-entropy secret
    description: >-
      A high-entropy value assigned to a setting or variable named like a password, secret, token or
      API key.
    severity: high
    keywords: [password, passwd, pwd, secret, token, apikey, api_key, api-key, api.key, access_key,
      access-key, access.key, accesskey, private_key, private-key, private.key, privatekey, credential]
    min-entropy: 3.5
    patterns:
      # application.properties, application.yml, .env: `key=value`, `key: value`
      - files: [properties, yml, yaml, env]
        regex: '(?im)^[ \t]*(?:-[ \t]+)?["'']?(?<key>[\w.\[\]-]*?(?:password|passwd|pwd|secret|token|api[_.-]?key|access[_.-]?key|private[_.-]?key|credentials?)[\w.\[\]-]*)["'']?[ \t]*[:=][ \t]*["'']?(?<secret>[^\s"''#]{8,})'
      # Java, Kotlin, Groovy, Scala: `String apiKey = "value"`
      - files: [java, kt, kts, groovy, scala]
        regex: '(?i)(?<![\w$])(?<key>[\w$]*(?:password|passwd|pwd|secret|token|api_?key|access_?key|private_?key|credentials?)[\w$]*)\s*=\s*"(?<secret>[^"\s]{8,})"'
      # Maven settings.xml and other XML: `<password>value</password>`
      - files: [xml]
        regex: '(?i)<(?<key>[\w.:-]*(?:password|passwd|secret|token|api[_.-]?key|access[_.-]?key|private[_.-]?key)[\w.:-]*)>\s*(?<secret>[^<\s]{8,})\s*</'
