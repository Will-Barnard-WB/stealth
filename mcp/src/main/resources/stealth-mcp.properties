# Read by `stealth mcp` only (spring.config.name=stealth-mcp), so the CLI's application.properties
# keeps the other commands non-web and quiet
spring.main.web-application-type=servlet
spring.main.banner-mode=off
spring.main.log-startup-info=false

server.address=127.0.0.1

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=stealth
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.instructions=stealth checks Java/Maven repositories for security debt \
  (known vulnerabilities, leaked secrets, end-of-life Java and Spring Boot) and tech debt \
  (outdated or unmaintained dependencies, duplicated code, repo hygiene). Use repo_health for an \
  overview and scores, list_findings for details and fixes, and check_dependency before adding \
  or upgrading a Maven dependency. Pass the repository's absolute path.

# Only tools: no prompts, resources or completions to advertise
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.completion=false

logging.level.root=warn
# Spring AI's annotation scanner trips this harmless startup warning
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate=error
logging.level.dev.stealth=info
